[package]
name = "hop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
bincode.workspace = true
clap.workspace = true
rand.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde_json.workspace = true
hop-protocol = { path = "../hop-protocol" }
clipboard-rs = { version = "0.3.5", default-features = false }
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = "2.6.3"
core-foundation = "0.10.1"
core-graphics = { version = "0.24.0", features = ["highsierra"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = "2.6.3"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }


[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.3", default-features = false, features = ["linux-static-hidraw"] }
