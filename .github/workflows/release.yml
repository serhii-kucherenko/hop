name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish assets to (example: v0.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS binaries
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build release binaries
        env:
          HOP_BUILD_CHANNEL: release
        run: |
          cargo build --release -p hop --target x86_64-apple-darwin
          cargo build --release -p hop --target aarch64-apple-darwin

      - name: Package macOS archives
        run: |
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/hop dist/hop
          tar -C dist -czf hop-x86_64-apple-darwin.tar.gz hop
          cp target/aarch64-apple-darwin/release/hop dist/hop
          tar -C dist -czf hop-aarch64-apple-darwin.tar.gz hop

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hop-macos-archives
          path: hop-*-apple-darwin.tar.gz

  build-windows:
    name: Build Windows binary
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        env:
          HOP_BUILD_CHANNEL: release
        run: cargo build --release -p hop --target x86_64-pc-windows-msvc

      - name: Package archive
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/hop.exe" "dist/hop.exe"
          Compress-Archive -Path "dist/hop.exe" -DestinationPath "hop-x86_64-pc-windows-msvc.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hop-windows-archive
          path: hop-x86_64-pc-windows-msvc.zip

  attach:
    name: Attach binaries to release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
